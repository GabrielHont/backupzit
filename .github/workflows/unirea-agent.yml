# Unirea fork: builds the Windows agent installer (MSI) for a fork tag and
# attaches it to the tag's release, with its SHA-256. WiX only runs on Windows.
name: unirea-agent
on:
  push:
    tags: ['v*-unirea.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Fork tag, e.g. v0.47.3-unirea.7'
        required: true
permissions:
  contents: write
jobs:
  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: WiX 5
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
      - name: Build
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $version = $tag.TrimStart('v')
          if ($version -notmatch '^(\d+)\.(\d+)\.(\d+)-unirea\.(\d+)$') { throw "not a fork tag: $tag" }
          $msi = "$($Matches[1]).$($Matches[2]).$([int]$Matches[3] * 100 + [int]$Matches[4])"
          ./packaging/windows/build-msi.ps1 -Version $version -MsiVersion $msi
          Get-ChildItem dist/*.msi | ForEach-Object { (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower() + "  " + $_.Name } | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          gh release view $tag 2>$null; if ($LASTEXITCODE -ne 0) { gh release create $tag --title $tag --notes "BackupZit, Unirea fork ($tag). AGPL-3.0; source: this tag." }
          gh release upload $tag dist/*.msi dist/SHA256SUMS.txt --clobber

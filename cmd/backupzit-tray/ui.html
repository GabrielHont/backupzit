<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>Unirea Backup Agent</title>
<style>
:root {
  --bg: #f7f3ea; --panel: #fffdf8; --text: #302b24; --muted: #6f665a; --line: #e6dfd1;
  --brand: #a64b36; --brand-2: #8a3d2b; --brand-soft: #f3e4dd;
  --ok: #16a34a; --ok-soft: #dcfce7; --run: #2563eb; --run-soft: #dbeafe;
  --warn: #d97706; --warn-soft: #fef3c7; --err: #dc2626; --err-soft: #fee2e2; --off: #7a7266; --off-soft: #efe9de;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1814; --panel: #24201b; --text: #ece6da; --muted: #a69c8d; --line: #3a332b;
    --brand-2: #e0a08c; --brand-soft: #3b231b; --ok-soft: #052e16; --run-soft: #0c1e4a; --warn-soft: #3a2506; --err-soft: #3b0d0d; --off-soft: #1f2937;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text);
  -webkit-user-select: none; user-select: none; overflow: hidden; display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: 12px; padding: 16px 24px; background: var(--panel); border-bottom: 1px solid var(--line); }
.logo { width: 34px; height: 34px; border-radius: 8px; background: var(--brand); display: grid; place-items: center; }
.brand { font-weight: 700; font-size: 17px; letter-spacing: -.01em; }
.brand span { font-weight: 450; }
.host { color: var(--muted); font-size: 12.5px; }
.conn { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.langs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-left: 14px; }
.langs button { background: transparent; color: var(--muted); border-radius: 0; padding: 4px 9px; font-size: 12px; font-weight: 600; }
.langs button[aria-pressed="true"] { background: var(--brand); color: #fff; }
.langs button:hover { filter: none; color: var(--text); }
.langs button[aria-pressed="true"]:hover { color: #fff; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--off); }
.dot.on { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
main { flex: 1; overflow: auto; padding: 20px 24px 8px; }
.hero { display: flex; gap: 18px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; }
.badge { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.badge svg { width: 30px; height: 30px; }
.s-ok .badge, .s-idle .badge { background: var(--ok-soft); color: var(--ok); }
.s-running .badge { background: var(--run-soft); color: var(--run); }
.s-warning .badge { background: var(--warn-soft); color: var(--warn); }
.s-error .badge { background: var(--err-soft); color: var(--err); }
.s-offline .badge { background: var(--off-soft); color: var(--off); }
.s-running .badge svg { animation: spin 1.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.hero h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -.01em; }
.hero p { margin: 3px 0 0; color: var(--muted); }
.bar { height: 6px; border-radius: 3px; background: var(--line); margin-top: 10px; overflow: hidden; display: none; }
.bar i { display: block; height: 100%; background: var(--run); width: 0; transition: width .6s; }
.s-running .bar { display: block; }
.grow { flex: 1; min-width: 0; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 14px 0; }
.fact { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
.fact b { display: block; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
.fact span { display: block; margin-top: 3px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 2px 8px; font-weight: 650; }
.jobs { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.job { display: grid; grid-template-columns: 1fr 190px 150px 128px; gap: 12px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); }
.job:first-child { border-top: 0; }
.job .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.job .kind { color: var(--muted); font-size: 12.5px; }
.job .col b { display: block; color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; }
.pill.success { background: var(--ok-soft); color: var(--ok); }
.pill.warning { background: var(--warn-soft); color: var(--warn); }
.pill.failed { background: var(--err-soft); color: var(--err); }
.pill.running { background: var(--run-soft); color: var(--run); }
.empty { padding: 22px; color: var(--muted); text-align: center; }
button { font: inherit; font-weight: 600; font-size: 13px; border: 0; border-radius: 9px; padding: 8px 14px; cursor: pointer;
  background: var(--brand); color: #fff; transition: filter .15s, transform .05s; }
button:hover { filter: brightness(1.08); }
button:active { transform: translateY(1px); }
button:disabled { opacity: .5; cursor: default; filter: none; }
button.ghost { background: var(--brand-soft); color: var(--brand-2); }
footer { display: flex; align-items: center; gap: 12px; padding: 12px 24px; border-top: 1px solid var(--line); background: var(--panel); font-size: 12.5px; color: var(--muted); }
footer .sp { flex: 1; }
.err { color: var(--err); font-size: 12.5px; margin-top: 8px; min-height: 1em; }
</style>
</head>
<body>
<header>
  <div class="logo"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#f7f3ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="7" height="10" rx="1"/><rect x="14" y="11" width="7" height="10" rx="1"/><path d="M6 11V9C3 9 3 5 8 5C8 1 16 1 16 5C21 5 21 9 18 9V11"/></svg></div>
  <div><div class="brand">Unirea <span>Backup Agent</span></div><div class="host" id="host">&nbsp;</div></div>
  <div class="conn"><span class="dot" id="dot"></span><span id="conn" data-t="connecting">Se conectează…</span>
    <div class="langs" role="group" aria-label="Limbă / Language"><button type="button" data-lang="ro" aria-pressed="true" title="Română">RO</button><button type="button" data-lang="en" aria-pressed="false" title="English">EN</button></div></div>
</header>
<main>
  <section class="hero s-offline" id="hero">
    <div class="badge" id="badge"></div>
    <div class="grow">
      <h1 id="headline" data-t="loading">Se încarcă…</h1>
      <p id="detail"></p>
      <div class="bar"><i id="bar"></i></div>
    </div>
  </section>
  <div class="facts">
    <div class="fact"><b data-t="lastBackup">Ultimul backup</b><span id="last">—</span></div>
    <div class="fact"><b data-t="nextBackup">Următorul backup</b><span id="next">—</span></div>
    <div class="fact"><b data-t="lastActivity">Ultima activitate</b><span id="activity">—</span></div>
  </div>
  <h2 data-t="jobsTitle">Backupurile acestui calculator</h2>
  <div class="jobs" id="jobs"><div class="empty" data-t="loading">Se încarcă…</div></div>
  <div class="err" id="err"></div>
</main>
<footer>
  <span id="ver"></span><span class="sp"></span>
</footer>
<script>
const icons = {
  ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.7-7 9-4-1.3-7-4.5-7-9V6z"/><path d="M8.5 12l2.4 2.4 4.6-4.8"/></svg>',
  running: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>',
  warning: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17.5v.5"/></svg>',
  error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>',
  offline: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M2 8.5a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0"/><path d="M12 19v.5M3 3l18 18"/></svg>'
};
icons.idle = icons.ok;
const $ = id => document.getElementById(id);
const TEXT = {
  ro: { connecting: 'Se conectează…', loading: 'Se încarcă…', lastBackup: 'Ultimul backup', nextBackup: 'Următorul backup',
    lastActivity: 'Ultima activitate', jobsTitle: 'Backupurile acestui calculator',
    thisComputer: 'Acest calculator: ', connected: 'Conectat la serverul de backup', unreachable: 'Fără legătură cu serverul',
    noService: 'Programul nu rulează', version: 'Versiunea ', serviceDown: 'Programul de backup nu rulează.',
    noJobs: 'Calculatorul nu are încă backup programat. Îl programați din portalul Unirea Cloud.', loadingJobs: 'Se încarcă backupurile…',
    running: 'în curs', last: 'Ultimul', next: 'Următorul', runningBtn: 'În curs…', backUp: 'Fă backup acum', starting: 'Pornește…' },
  en: { connecting: 'Connecting…', loading: 'Loading…', lastBackup: 'Last backup', nextBackup: 'Next backup',
    lastActivity: 'Last activity', jobsTitle: 'Backup jobs of this computer',
    thisComputer: 'This computer: ', connected: 'Connected to the backup server', unreachable: 'Backup server not reachable',
    noService: 'Agent service not running', version: 'Version ', serviceDown: 'The agent service is not running.',
    noJobs: 'No backup jobs for this computer yet. Create one in the Unirea Cloud portal.', loadingJobs: 'Loading backup jobs…',
    running: 'running', last: 'Last', next: 'Next', runningBtn: 'Running…', backUp: 'Back up now', starting: 'Starting…' }
};
let lang = 'ro', lastSummary = null;
const T = k => TEXT[lang][k];
function setLangUI(l) {
  lang = l === 'en' ? 'en' : 'ro';
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(e => { e.textContent = T(e.dataset.t); });
  document.querySelectorAll('.langs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let busy = {};

function render(s) {
  lastSummary = s;
  if (s.lang && s.lang !== lang) setLangUI(s.lang);
  const st = s.status || {};
  $('hero').className = 'hero s-' + s.state;
  $('badge').innerHTML = icons[s.state] || icons.ok;
  $('headline').textContent = s.headline;
  $('detail').textContent = s.detail;
  $('bar').style.width = (s.percent >= 0 ? s.percent : 15) + '%';
  $('last').textContent = s.last_text || '—';
  $('next').textContent = s.next_text || '—';
  $('activity').textContent = s.activity_text || '—';
  $('host').textContent = st.hostname ? T('thisComputer') + st.hostname : '';
  $('dot').className = 'dot' + (st.connected ? ' on' : '');
  $('conn').textContent = st.connected ? T('connected') : (s.status ? T('unreachable') : T('noService'));
  $('ver').textContent = st.version ? T('version') + st.version : '';
  const jobs = s.jobs || [];
  if (!s.status) { $('jobs').innerHTML = '<div class="empty">' + T('serviceDown') + '</div>'; return; }
  if (!jobs.length) { $('jobs').innerHTML = '<div class="empty">' + (st.jobs_at ? T('noJobs') : T('loadingJobs')) + '</div>'; return; }
  $('jobs').innerHTML = jobs.map(j => {
    const last = j.running ? '<span class="pill running">' + T('running') + '</span>' :
      (j.last_status ? '<span class="pill ' + esc(j.last_status) + '">' + esc(j.status_text) + '</span> ' : '') + esc(j.last_text);
    return '<div class="job"><div><div class="name" title="' + esc(j.last_message) + '">' + esc(j.name) + '</div><div class="kind">' + esc(j.kind_text) + ' · ' + esc(j.schedule_text) + '</div></div>' +
      '<div class="col"><b>' + T('last') + '</b>' + last + '</div><div class="col"><b>' + T('next') + '</b>' + esc(j.next_text) + '</div>' +
      '<div><button data-job="' + j.id + '"' + (j.running || busy[j.id] ? ' disabled' : '') + '>' + (j.running ? T('runningBtn') : T('backUp')) + '</button></div></div>';
  }).join('');
}

window.bzUpdate = render;
document.addEventListener('click', async e => {
  const b = e.target.closest('button[data-job]');
  if (b) {
    const id = Number(b.dataset.job);
    busy[id] = true; b.disabled = true; b.textContent = T('starting'); $('err').textContent = '';
    const err = await window.bzRun(id);
    if (err) { $('err').textContent = err; }
    setTimeout(() => { delete busy[id]; }, 8000);
  }
  const lb = e.target.closest('.langs button');
  if (lb && lb.dataset.lang !== lang) {
    // Labels switch at once; the status texts come back from the tray.
    setLangUI(lb.dataset.lang);
    if (lastSummary) render(Object.assign({}, lastSummary, { lang }));
    if (window.bzSetLang) window.bzSetLang(lang);
  }
});
document.addEventListener('contextmenu', e => e.preventDefault());
(async () => { try { render(await window.bzStatus()); } catch (e) {} })();
</script>
</body>
</html>
